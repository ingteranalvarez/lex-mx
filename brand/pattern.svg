<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">Lex MX pattern</title>
  <desc id="desc">Repeating low-contrast Lex MX symbol pattern.</desc>
  <rect width="480" height="480" fill="#FFFFFF"/>
  <defs>
    <pattern id="lexmx-pattern" width="240" height="240" patternUnits="userSpaceOnUse">
      <image width="240" height="240" opacity="0.08" href="data:image/png;base64,"/>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="url(#lexmx-pattern)"/>
</svg>
